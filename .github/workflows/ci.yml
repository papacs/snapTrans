name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend tests / typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Go tests (Windows desktop)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...

  wails-build:
    name: Wails build smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build desktop app
        run: wails build
      - name: Verify OCR build dependency
        shell: powershell
        run: |
          ./scripts/ensure-rapidocr.test.ps1
          if (-not (Test-Path build/bin/RapidOCR-json_v0.2.0/RapidOCR-json.exe)) { throw 'OCR executable missing from build output' }
          if (-not (Test-Path build/bin/RapidOCR-json_v0.2.0/models/*.onnx)) { throw 'OCR models missing from build output' }
